<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletic Certificate Generator</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        
        /* New styling for the template download button */
        .template-btn { display: block; background-color: #6c757d; color: white; text-align: center; text-decoration: none; padding: 10px; font-size: 14px; border-radius: 4px; margin-bottom: 25px; transition: background-color 0.2s; }
        .template-btn:hover { background-color: #5a6268; }
        
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #004494; }
        #status { margin-top: 20px; font-weight: bold; color: #d9534f; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Walton Certificate Generator</h2>
    
    <a href="./roster_template.csv" download class="template-btn">
        ⬇️ Download Blank CSV Template
    </a>
    
    <label for="certType">1. Select Award Type:</label>
    <select id="certType">
        <option value="varsity">Varsity Letter</option>
        <option value="jv">JV Award</option>
        <option value="scholar">Scholar Athlete</option>
    </select>
    
    <label for="csvFile">2. Upload Roster (CSV):</label>
    <input type="file" id="csvFile" accept=".csv">
    
    <button onclick="processFiles()">Generate Print File</button>
    <p id="status"></p>
</div>

<script>
    // Configuration dictionary for the layouts
    const templates = {
        jv: {
            filename: 'jv_template.pdf',
            fields: {
                name:  { x: 195, y: 105, maxWidth: 100, fontSize: 36 },
                sport: { x: 195, y: 135, maxWidth: 80,  fontSize: 24 }, 
                year:  { x: 172, y: 158, maxWidth: 15,  fontSize: 16 }  
            }
        },
        scholar: {
            filename: 'scholar_template.pdf',
            fields: {
                name:  { x: 175, y: 125, maxWidth: 110, fontSize: 32 },
                year:  { x: 155, y: 165, maxWidth: 40,  fontSize: 16 } 
            }
        },
        varsity: {
            filename: 'varsity_template.pdf',
            fields: {
                name:  { x: 190, y: 110, maxWidth: 110, fontSize: 36 },
                sport: { x: 190, y: 140, maxWidth: 90,  fontSize: 28 },
                year:  { x: 190, y: 165, maxWidth: 50,  fontSize: 18 }
            }
        }
    };

    // Helper function to calculate points from millimeters (PDF-lib uses points)
    // 1 mm = 2.83465 points
    const mmToPt = (mm) => mm * 2.83465;

    async function processFiles() {
        const fileInput = document.getElementById('csvFile').files[0];
        const certType = document.getElementById('certType').value;
        const statusEl = document.getElementById('status');

        if (!fileInput) {
            statusEl.innerText = "Please upload a CSV file first.";
            statusEl.style.color = "#d9534f";
            return;
        }

        statusEl.innerText = "Reading data and generating PDF... please wait.";
        statusEl.style.color = "#5cb85c";

        // Parse the CSV using PapaParse
        Papa.parse(fileInput, {
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                try {
                    await buildPdf(results.data, templates[certType]);
                    statusEl.innerText = "Success! PDF downloaded.";
                } catch (error) {
                    console.error(error);
                    statusEl.innerText = "An error occurred. Check the console.";
                    statusEl.style.color = "#d9534f";
                }
            }
        });
    }

    async function buildPdf(studentData, config) {
        const { PDFDocument, rgb, StandardFonts } = PDFLib;
        
        // Fetch the blank template PDF from your GitHub Pages folder
        const templateResponse = await fetch(`./${config.filename}`);
        if (!templateResponse.ok) throw new Error(`Could not load template: ${config.filename}`);
        const templateBytes = await templateResponse.arrayBuffer();

        // Create a brand new empty PDF to hold all the generated pages
        const finalPdf = await PDFDocument.create();
        const font = await finalPdf.embedFont(StandardFonts.HelveticaBold);

        // Loop through each student in the CSV
        for (const student of studentData) {
            // Load a fresh copy of the template for this student
            const studentDoc = await PDFDocument.load(templateBytes);
            const pages = studentDoc.getPages();
            const page = pages[0];
            
            // Reusable function to calculate text width and draw centered text
            const drawCenteredText = (text, fieldConfig) => {
                if (!text) return;
                let currentSize = fieldConfig.fontSize;
                let textWidth = font.widthOfTextAtSize(text, currentSize);
                const maxPtWidth = mmToPt(fieldConfig.maxWidth);

                // Auto-scale down if text is too wide
                while (textWidth > maxPtWidth && currentSize > 10) {
                    currentSize -= 1;
                    textWidth = font.widthOfTextAtSize(text, currentSize);
                }

                // PDF coordinates start from the BOTTOM left. 
                // We convert our top-down Y measurements (215.9mm is the height of an 8.5" page)
                const pdfX = mmToPt(fieldConfig.x) - (textWidth / 2);
                const pdfY = mmToPt(215.9 - fieldConfig.y); 

                page.drawText(text, {
                    x: pdfX,
                    y: pdfY,
                    size: currentSize,
                    font: font,
                    color: rgb(0, 0, 0)
                });
            };

            // Combine First and Last name
            const fullName = `${student.FirstName || ''} ${student.LastName || ''}`.trim();
            drawCenteredText(fullName, config.fields.name);

            if (config.fields.sport && student.Sport) {
                drawCenteredText(student.Sport, config.fields.sport);
            }
            if (config.fields.year && student.Year) {
                // Determine if we need just the last two digits (for JV) or the full string
                let displayYear = student.Year;
                if (config.filename === 'jv_template.pdf' && displayYear.length === 4) {
                    displayYear = displayYear.slice(-2);
                }
                drawCenteredText(displayYear, config.fields.year);
            }

            // Copy this finished student page into our master PDF document
            const [copiedPage] = await finalPdf.copyPages(studentDoc, [0]);
            finalPdf.addPage(copiedPage);
        }

        // Save the master document and trigger download
        const pdfBytes = await finalPdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Certificates_${Date.now()}.pdf`;
        link.click();
    }
</script>
</body>
</html>
