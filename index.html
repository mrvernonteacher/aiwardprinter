<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walton Athletic Certificate Generator</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #004494; }
        #status { margin-top: 20px; font-weight: bold; color: #d9534f; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Walton Certificate Generator</h2>
    
    <label for="certType">1. Select Award Type:</label>
    <select id="certType">
        <option value="varsity">Varsity Letter</option>
        <option value="jv">JV Award</option>
        <option value="scholar">Scholar Athlete</option>
    </select>
    
    <label for="csvFile">2. Upload Roster (CSV):</label>
    <input type="file" id="csvFile" accept=".csv">
    
    <button onclick="processFiles()">Generate Print File</button>
    <p id="status"></p>
</div>

<script>
    const templates = {
        jv: { filename: 'jv_template.pdf', fields: { name: { x: 140, y: 118, maxWidth: 106, fontSize: 36, align: 'center', useHandwriting: true }, year: { x: 162, y: 168, maxWidth: 20, fontSize: 28, align: 'left', useHandwriting: false, isItalic: true } } },
        scholar: { filename: 'scholar_template.pdf', fields: { name: { x: 182, y: 130, maxWidth: 130, fontSize: 32, align: 'center', useHandwriting: true }, year: { x: 179, y: 157, maxWidth: 32, fontSize: 16, align: 'center', useHandwriting: false } } },
        varsity: { filename: 'varsity_template.pdf', fields: { name: { x: 177.5, y: 120, maxWidth: 139, fontSize: 44, align: 'center', useHandwriting: true }, sport: { x: 140, y: 157, maxWidth: 66, fontSize: 28, align: 'center', useHandwriting: false }, year: { x: 215, y: 157, maxWidth: 66, fontSize: 18, align: 'center', useHandwriting: false } } }
    };

    const mmToPt = (mm) => mm * 2.83465;

    async function processFiles() {
        const fileInput = document.getElementById('csvFile').files[0];
        const certType = document.getElementById('certType').value;
        const statusEl = document.getElementById('status');

        if (!fileInput) {
            statusEl.innerText = "Error: Please upload a CSV file.";
            return;
        }

        statusEl.innerText = "Generating... this may take a moment to fetch the font.";
        statusEl.style.color = "#5cb85c";

        Papa.parse(fileInput, {
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                try {
                    await buildPdf(results.data, templates[certType]);
                    statusEl.innerText = "Success! PDF downloaded.";
                } catch (error) {
                    console.error(error);
                    statusEl.innerText = `Error: ${error.message}`;
                    statusEl.style.color = "#d9534f";
                }
            }
        });
    }

    async function buildPdf(studentData, config) {
        const { PDFDocument, rgb, StandardFonts } = PDFLib;

        // 1. Fetch Dancing Script directly from Google's stable CDN
        const fontUrl = 'https://fonts.gstatic.com/s/dancingscript/v25/If2QXeTY95SJAks8yW70K677S7mYp9ceO86_O-M.ttf';
        const fontResponse = await fetch(fontUrl);
        const fontBuffer = await fontResponse.arrayBuffer();

        // 2. Fetch Template
        const templateResponse = await fetch(`./${config.filename}`);
        const templateBytes = await templateResponse.arrayBuffer();

        const finalPdf = await PDFDocument.create();
        finalPdf.registerFontkit(window.fontkit);
        
        // 3. Embed fonts (Subset false is crucial here)
        const fontHandwriting = await finalPdf.embedFont(fontBuffer, { subset: false });
        const fontStandard = await finalPdf.embedFont(StandardFonts.HelveticaBold);
        const fontItalic = await finalPdf.embedFont(StandardFonts.HelveticaBoldOblique);

        for (const student of studentData) {
            const studentDoc = await PDFDocument.load(templateBytes);
            const page = studentDoc.getPages()[0];
            const { height: pageHeight } = page.getSize();
            
            const drawText = (text, fieldConfig) => {
                if (!text) return;
                const cleanText = String(text).trim();
                const activeFont = fieldConfig.useHandwriting ? fontHandwriting : (fieldConfig.isItalic ? fontItalic : fontStandard);
                
                let currentSize = fieldConfig.fontSize;
                let textWidth = activeFont.widthOfTextAtSize(cleanText, currentSize);
                const maxPtWidth = mmToPt(fieldConfig.maxWidth);

                while (textWidth > maxPtWidth && currentSize > 8) {
                    currentSize -= 1;
                    textWidth = activeFont.widthOfTextAtSize(cleanText, currentSize);
                }

                let pdfX = mmToPt(fieldConfig.x);
                if (fieldConfig.align === 'center') pdfX -= (textWidth / 2);
                const pdfY = pageHeight - mmToPt(fieldConfig.y);

                page.drawText(cleanText, { x: pdfX, y: pdfY, size: currentSize, font: activeFont, color: rgb(0, 0, 0) });
            };

            const fullName = `${student.FirstName || ''} ${student.LastName || ''}`.trim();
            drawText(fullName, config.fields.name);
            if (config.fields.sport) drawText(student.Sport, config.fields.sport);
            if (config.fields.year && student.Year) {
                let y = student.Year;
                if (config.filename === 'jv_template.pdf') y = y.slice(-2);
                drawText(y, config.fields.year);
            }

            const [copied] = await finalPdf.copyPages(studentDoc, [0]);
            finalPdf.addPage(copied);
        }

        const pdfBytes = await finalPdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Certificates_${Date.now()}.pdf`;
        link.click();
    }
</script>
</body>
</html>
