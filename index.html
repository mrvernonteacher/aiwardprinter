<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walton Athletic Certificate Generator</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .template-btn { display: block; background-color: #6c757d; color: white; text-align: center; text-decoration: none; padding: 10px; font-size: 14px; border-radius: 4px; margin-bottom: 25px; transition: background-color 0.2s; }
        .template-btn:hover { background-color: #5a6268; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #004494; }
        #status { margin-top: 20px; font-weight: bold; color: #d9534f; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Walton Certificate Generator</h2>
    
    <a href="./roster_template.csv" download class="template-btn">
        ⬇️ Download Blank CSV Template
    </a>
    
    <label for="certType">1. Select Award Type:</label>
    <select id="certType">
        <option value="varsity">Varsity Letter</option>
        <option value="jv">JV Award</option>
        <option value="scholar">Scholar Athlete</option>
    </select>
    
    <label for="csvFile">2. Upload Roster (CSV):</label>
    <input type="file" id="csvFile" accept=".csv">
    
    <button onclick="processFiles()">Generate Print File</button>
    <p id="status"></p>
</div>

<script>
    // New Configuration with explicit 'align' properties
    const templates = {
        jv: {
            filename: 'jv_template.pdf',
            fields: {
                name:  { x: 143, y: 118, maxWidth: 106, fontSize: 36, align: 'center' },
                // Left aligned at the exact left boundary (162mm), much larger font
                year:  { x: 162, y: 166, maxWidth: 20,  fontSize: 28, align: 'left' }  
            }
        },
        scholar: {
            filename: 'scholar_template.pdf',
            fields: {
                name:  { x: 185, y: 130, maxWidth: 130, fontSize: 32, align: 'center' },
                year:  { x: 180, y: 157, maxWidth: 32,  fontSize: 16, align: 'center' } 
            }
        },
        varsity: {
            filename: 'varsity_template.pdf',
            fields: {
                name:  { x: 180.5, y: 120, maxWidth: 139, fontSize: 44, align: 'center' },
                sport: { x: 142,   y: 157, maxWidth: 66,  fontSize: 28, align: 'center' },
                year:  { x: 216,   y: 157, maxWidth: 66,  fontSize: 18, align: 'center' }
            }
        }
    };

    const mmToPt = (mm) => mm * 2.83465;

    async function processFiles() {
        const fileInput = document.getElementById('csvFile').files[0];
        const certType = document.getElementById('certType').value;
        const statusEl = document.getElementById('status');

        if (!fileInput) {
            statusEl.innerText = "Error: Please upload a CSV file first.";
            return;
        }

        statusEl.innerText = "Reading data and generating PDF... please wait.";
        statusEl.style.color = "#5cb85c";

        Papa.parse(fileInput, {
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                try {
                    await buildPdf(results.data, templates[certType]);
                    statusEl.innerText = "Success! PDF downloaded.";
                } catch (error) {
                    console.error(error);
                    statusEl.innerText = `Error: ${error.message}`;
                    statusEl.style.color = "#d9534f";
                }
            }
        });
    }

    async function buildPdf(studentData, config) {
        const { PDFDocument, rgb, StandardFonts } = PDFLib;

        const templateResponse = await fetch(`./${config.filename}`);
        if (!templateResponse.ok) throw new Error(`Could not find template PDF: ${config.filename}.`);
        const templateBytes = await templateResponse.arrayBuffer();

        const finalPdf = await PDFDocument.create();
        const fontStandard = await finalPdf.embedFont(StandardFonts.HelveticaBold);

        for (const student of studentData) {
            const studentDoc = await PDFDocument.load(templateBytes);
            const pages = studentDoc.getPages();
            const page = pages[0];
            
            const { height: pageHeight } = page.getSize();
            
            // Dynamic drawing logic based on the 'align' property
            const drawTextContent = (text, fieldConfig) => {
                if (!text) return;
                
                let currentSize = fieldConfig.fontSize;
                let textWidth = fontStandard.widthOfTextAtSize(text, currentSize);
                const maxPtWidth = mmToPt(fieldConfig.maxWidth);

                while (textWidth > maxPtWidth && currentSize > 10) {
                    currentSize -= 1;
                    textWidth = fontStandard.widthOfTextAtSize(text, currentSize);
                }

                let pdfX;
                if (fieldConfig.align === 'left') {
                    pdfX = mmToPt(fieldConfig.x);
                } else if (fieldConfig.align === 'right') {
                    pdfX = mmToPt(fieldConfig.x) - textWidth;
                } else {
                    // Default to center
                    pdfX = mmToPt(fieldConfig.x) - (textWidth / 2);
                }

                const pdfY = pageHeight - mmToPt(fieldConfig.y); 

                page.drawText(text, {
                    x: pdfX,
                    y: pdfY,
                    size: currentSize,
                    font: fontStandard,
                    color: rgb(0, 0, 0)
                });
            };

            const fName = student.FirstName || '';
            const lName = student.LastName || '';
            const fullName = `${fName} ${lName}`.trim();

            drawTextContent(fullName, config.fields.name);
            
            if (config.fields.sport && student.Sport) {
                drawTextContent(student.Sport, config.fields.sport);
            }
            if (config.fields.year && student.Year) {
                let displayYear = student.Year;
                
                if (config.filename === 'jv_template.pdf' && displayYear.length >= 2) {
                    displayYear = displayYear.slice(-2);
                }
                drawTextContent(displayYear, config.fields.year);
            }

            const [copiedPage] = await finalPdf.copyPages(studentDoc, [0]);
            finalPdf.addPage(copiedPage);
        }

        const pdfBytes = await finalPdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        
        const certType = document.getElementById('certType').value;
        link.download = `Certificates_${certType}_${Date.now()}.pdf`;
        link.click();
    }
</script>
</body>
</html>
